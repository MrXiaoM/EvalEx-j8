name: Release and publish to Maven Central
on:
  push:
    tags:
      - '*'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
      - name: build artifact
        run: ./gradlew clean cleanMavenPublishingStage build -Pversion=${{ github.ref_name }}
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          generateReleaseNotes: true
          artifacts: "${{ github.workspace }}/build/libs/*.jar"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Package to Stage Repository
        run: ./gradlew publishAllPublicationsToMavenStageRepository -Pversion=${{ github.ref_name }}
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-repository
          path: build/maven-publishing-stage/*
          if-no-files-found: error
      - name: Upload to Central Portal
        run: ./gradlew publishToMavenCentral -Pversion=${{ github.ref_name }}
        env:
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PUBLISH_ACCOUNT }}
